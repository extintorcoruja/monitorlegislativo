name: Deploy Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '03_consulta_proposituras/app/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_consulta_proposituras/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install clasp
        run: npm install -g @google/clasp@3.4.0
      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "Secret CLASPRC_JSON não configurado."; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Push to Google Apps Script
        run: clasp push --force
      - name: Update deployment when configured
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          if [ -z "$APPS_SCRIPT_DEPLOYMENT_ID" ]; then echo "Deployment não configurado; push concluído."; exit 0; fi
          clasp update-deployment "$APPS_SCRIPT_DEPLOYMENT_ID" --description "Deploy automático via GitHub"
